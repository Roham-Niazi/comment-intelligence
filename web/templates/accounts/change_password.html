{%extends "dashboard_base.html"%}

{%block title%}
<title>داشبورد | تغییر رمزعبور</title>
{%endblock%}


{%block content%}
	<div class="container-fluid">
		<div class="card card-body bg-light shadow p-3 mx-auto" style="border-radius: 15px; width:30rem;" id="main_card">
			<h5 class="card-h5-title">تغییر رمزعبور</h5>

			{%csrf_token%}


			<div class="input-group mb-3 mt-4">
				<input type="password" class="form-control" placeholder="رمزعبور فعلی" id="password_input_1">
				<span class="input-group-text"><i class="bi bi-eye" onmousedown="document.getElementById('password_input_1').type='text'; this.classList.remove('bi-eye'); this.classList.add('bi-eye-slash')" onmouseup="document.getElementById('password_input_1').type='password'; this.classList.add('bi-eye'); this.classList.remove('bi-eye-slash')"></i></span>
			</div>

			<div class="input-group mb-3">
				<input type="password" class="form-control" placeholder="رمزعبور جدید" id="password_input_2">
				<span class="input-group-text"><i class="bi bi-eye" onmousedown="document.getElementById('password_input_2').type='text'; this.classList.remove('bi-eye'); this.classList.add('bi-eye-slash')" onmouseup="document.getElementById('password_input_2').type='password'; this.classList.add('bi-eye'); this.classList.remove('bi-eye-slash')"></i></span>
			</div>

			<div class="input-group mb-3">
				<input type="password" class="form-control" placeholder="تکرار رمزعبور جدید" id="password_input_3">
				<span class="input-group-text"><i class="bi bi-eye" onmousedown="document.getElementById('password_input_3').type='text'; this.classList.remove('bi-eye'); this.classList.add('bi-eye-slash')" onmouseup="document.getElementById('password_input_3').type='password'; this.classList.add('bi-eye'); this.classList.remove('bi-eye-slash')"></i></span>
			</div>

			<div class="text-center"><button class="btn btn-primary" onclick="send_data()">ذخیره تغییرات</button></div>
		</div>
	</div>


	<script src="/static/js/change_password.js"></script>
{%endblock%}
