{%extends "dashboard_base.html"%}

{%block title%}
<title>داشبورد | پیشخوان</title>
{%endblock%}


{%block content%}
	<div class="container-fluid">
		{%csrf_token%}
		<div class="card card-body bg-light mx-auto shadow rounded-15 mt-5" style="width: 50rem; max-width: 100%;" id="chart_card">
			<h5 class="card-h5-title">آمار</h5>

			<div class="input-group mt-3">
				<span class="input-group-text">تگ</span>
				<select class="form-control" onchange="update_chart(this.value)" id="tag_select">
					<option value="">همه موارد</option>
					{%for tag in tags%}
					<option value="{{tag}}">{{tag}}</option>
					{%endfor%}
				</select>
			</div>

			<div id="charts_div">
				<div class="mt-4" style="height: 300px">
					<canvas id="recommendation_chart"></canvas>
				</div>
				<div class="mt-5" style="height: 300px">
					<canvas id="offensivity_chart"></canvas>
				</div>
			</div>
		</div>
	</div>

	<script src="/static/vendor/chart.js/chart.js"></script>
	<script src="/static/js/dashboard2.js"></script>
{%endblock%}
